# Server
server.port=${SERVER_PORT:8080}

# Database - MariaDB
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:astro}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# SQL init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=${JWT_SECRET:mySuperSecretKeyForJwtTokenGeneration123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend
frontend.url=${FRONTEND_URL:http://localhost:5170}

# Uploads
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Nominatim (place autocomplete)
app.nominatim.url=https://nominatim.openstreetmap.org
app.nominatim.user-agent=AstrologyApp/1.0 (dev)

# OpenAI — Chat
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini
openai.max-tokens=600
openai.temperature=0.8

# Logging
logging.level.com.astrologytalk=DEBUG