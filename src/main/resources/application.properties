# Server
server.port=${SERVER_PORT:8080}

# Database - MariaDB
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:astro}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=${JWT_SECRET:mySuperSecretKeyForJwtTokenGeneration123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# URL
frontend.url=${FRONTEND_URL:http://localhost:5170}
backend.url=${BACKEND_URL:http://localhost:8080}

# Uploads
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Nominatim (place autocomplete)
app.nominatim.url=https://nominatim.openstreetmap.org
app.nominatim.user-agent=AstrologyApp/1.0 (dev)

# Email (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# App name
app.name=${APP_NAME:Jyotish AI}

# OpenAI
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini
openai.max-tokens=600
openai.temperature=0.8

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-2.0-flash
gemini.max-tokens=600
gemini.temperature=0.8

# Logging
logging.level.com.astrologytalk=DEBUG

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Cashfree Payment Gateway
cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.mode=${CASHFREE_MODE:sandbox}
cashfree.webhook.secret=${CASHFREE_WEBHOOK_SECRET:}

# SabPaisa Payment Gateway
sabpaisa.merchant.id=${SABPAISA_MERCHANT_ID}
sabpaisa.api.key=${SABPAISA_API_KEY}
sabpaisa.secret.key=${SABPAISA_SECRET_KEY}
sabpaisa.base.url=${SABPAISA_BASE_URL:https://staging-sb-merchant-api.sabpaisa.in}
sabpaisa.environment=${SABPAISA_ENVIRONMENT:sandbox}
sabpaisa.verify.webhook=${SABPAISA_VERIFY_WEBHOOK:true}